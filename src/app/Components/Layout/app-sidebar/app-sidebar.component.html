<!-- Fondo oscuro en móvil cuando el menú está abierto -->
@if (nav.sidebarOpen()) {
	<div class="fixed inset-0 z-20 bg-slate-900/40 lg:hidden" aria-hidden="true" (click)="nav.closeSidebar()"></div>
}

<aside
	class="fixed bottom-0 left-0 top-header z-20 w-sidebar border-r border-slate-200 bg-white transition-transform lg:translate-x-0"
	[class.-translate-x-full]="!nav.sidebarOpen()"
	[class.translate-x-0]="nav.sidebarOpen()"
>
	<nav class="flex flex-col gap-1 p-3" aria-label="Menú principal">
		@for (item of nav.items(); track item.id) {
			<a
				[routerLink]="item.route"
				routerLinkActive="bg-brand-50 text-brand-700"
				#rla="routerLinkActive"
				[attr.aria-current]="rla.isActive ? 'page' : null"
				class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
			>
				{{ item.label }}
			</a>
		}
	</nav>
</aside>
