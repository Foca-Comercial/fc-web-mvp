<!-- Cabecera: logo, nombre y estado -->
<div class="flex items-center justify-between gap-2">
	<div class="flex min-w-0 items-center gap-2">
		<span class="grid size-10 shrink-0 place-items-center rounded-full bg-brand-900">
			<app-icon name="map" size="size-5" class="text-white" />
		</span>
		<h3 class="truncate text-sm font-semibold text-slate-900" [title]="card().route.name">{{ card().route.name }}</h3>
	</div>
	<span
		class="shrink-0 whitespace-nowrap rounded-full border px-2.5 py-0.5 text-xs font-medium"
		[class]="added() ? 'border-slate-500 bg-slate-200 text-slate-600' : 'border-success-700 bg-success-200 text-success-700'"
	>
		{{ statusLabel() }}
	</span>
</div>

<!-- Cajas informativas -->
<dl class="grid grid-cols-2 gap-3">
	<div class="rounded-xl bg-brand-200 px-3 py-2">
		<dt class="flex items-center gap-1.5 text-xs text-slate-600">
			<app-icon name="building-office-2" size="size-5" class="text-slate-900" />
			N° de clientes
		</dt>
		<dd class="mt-0.5 text-base font-semibold tabular-nums text-slate-900">{{ card().route.clients_count }}</dd>
	</div>
	<div class="rounded-xl bg-brand-200 px-3 py-2">
		<dt class="flex items-center gap-1.5 text-xs text-slate-600">
			<app-icon name="clock" size="size-5" class="text-slate-900" />
			Hora de salida
		</dt>
		<dd class="mt-0.5 text-base font-semibold tabular-nums text-slate-900">{{ departure() }}</dd>
	</div>
</dl>

<!-- Clientes que contiene (dos líneas como máximo) -->
<p class="min-h-10 text-sm leading-5">
	<span class="font-semibold text-slate-900">Contiene:</span>
	@if (card().clientNames) {
		<span class="line-clamp-2 font-medium text-slate-600" [title]="card().clientNames">{{ card().clientNames }}</span>
	} @else {
		<span class="block font-medium text-slate-500">Sin clientes asignados</span>
	}
</p>

<!-- Acciones -->
<div class="mt-auto grid grid-cols-2 gap-3">
	<button
		type="button"
		class="flex h-9 items-center justify-center gap-1 rounded-xl bg-slate-300 px-1 text-sm font-semibold text-slate-900 transition hover:bg-slate-400/70"
		[attr.aria-label]="'Ver detalles de la ruta ' + card().route.name"
		(click)="viewDetails.emit()"
	>
		<app-icon name="eye" size="size-5" />
		Ver detalles
	</button>

	@if (added()) {
		<button
			type="button"
			class="flex h-9 cursor-not-allowed items-center justify-center gap-1 rounded-xl bg-slate-200 px-1 text-sm font-semibold text-slate-500"
			disabled
			title="Los pedidos de esta ruta ya están en el tablero de despachos"
		>
			<app-icon name="check-circle" size="size-5" />
			Vista principal
		</button>
	} @else {
		<button
			type="button"
			class="flex h-9 items-center justify-center gap-1 rounded-xl bg-brand-700 px-1 text-sm font-semibold text-white transition hover:bg-brand-800 active:bg-brand-950"
			[attr.aria-label]="'Agregar la ruta ' + card().route.name + ' a la vista principal'"
			title="Generar los pedidos de la ruta en el tablero de despachos"
			(click)="addToMain.emit()"
		>
			<app-icon name="tv" size="size-5" />
			Vista principal
		</button>
	}
</div>
