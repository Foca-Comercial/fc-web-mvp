<main class="flex min-h-screen items-center justify-center bg-slate-100 p-4">
	<section class="w-full max-w-sm rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200">
		<header class="mb-6 text-center">
			<h1 class="text-2xl font-semibold text-brand-700">Foca Comercial</h1>
			<p class="mt-1 text-sm text-slate-500">Inicia sesión para continuar</p>
		</header>

		@if (sessionExpired()) {
			<p class="mb-4 rounded-lg bg-amber-50 px-3 py-2 text-sm text-amber-800" role="status">
				Tu sesión expiró. Vuelve a iniciar sesión.
			</p>
		}

		<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4" novalidate>
			<div>
				<label for="username" class="form-label">Usuario</label>
				<input
					id="username"
					type="text"
					formControlName="username"
					autocomplete="username"
					autocapitalize="none"
					class="form-input"
					[attr.aria-invalid]="invalid('username')"
				/>
				@if (invalid('username')) {
					<p class="form-error">Ingresa tu usuario.</p>
				}
			</div>

			<div>
				<label for="password" class="form-label">Contraseña</label>
				<div class="relative">
					<input
						id="password"
						[type]="showPassword() ? 'text' : 'password'"
						formControlName="password"
						autocomplete="current-password"
						class="form-input pr-20"
						[attr.aria-invalid]="invalid('password')"
					/>
					<button
						type="button"
						class="absolute inset-y-0 right-0 px-3 text-xs font-medium text-slate-500 hover:text-slate-700"
						(click)="showPassword.set(!showPassword())"
					>
						{{ showPassword() ? 'Ocultar' : 'Mostrar' }}
					</button>
				</div>
				@if (invalid('password')) {
					<p class="form-error">Ingresa tu contraseña.</p>
				}
			</div>

			@if (loginError()) {
				<p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ loginError() }}</p>
			}

			<button type="submit" class="btn-primary w-full" [disabled]="submitting()">
				{{ submitting() ? 'Ingresando...' : 'Ingresar' }}
			</button>
		</form>
	</section>
</main>
